# Copy to application.properties (gitignored) for local development.
# Every setting also works as an environment variable; see application.yml for the defaults.

spring.datasource.url=jdbc:postgresql://localhost:5432/jmcrm
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD_HERE

# Creates your admin account the first time the app starts against an empty user table.
app.bootstrap.admin-email=you@jane-michael.com
app.bootstrap.admin-password=CHOOSE_A_LONG_PASSWORD
app.bootstrap.admin-name=Michael

# Flyway manages the schema. Leave Hibernate's schema tool off.
spring.jpa.hibernate.ddl-auto=none
