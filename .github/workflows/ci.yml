name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

# Shared database settings. application.properties is gitignored, so CI
# configures Spring through environment variables instead. Flyway builds the schema.
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jmcrm
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jmcrm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee mvn.log

      # Surfaces compiler and test errors as annotations on the pull request.
      - name: Report failures
        if: failure()
        run: |
          annotate() {
            local title="$1" file="$2"
            [ -s "$file" ] || return 0
            local message
            message=$(cut -c1-400 "$file" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${title}::${message}"
          }
          grep -E '^\[ERROR\]' mvn.log | grep -vE '^\[ERROR\] *$|Re-run Maven|full stack trace|-e switch|-X switch|Help 1|^\[ERROR\] *->' | head -60 > maven-errors.txt || true
          grep -E 'Caused by:|Exception:|SQL Error|ERROR [0-9]+ ---' mvn.log | sort | uniq | head -40 > causes.txt || true
          annotate "Maven errors" maven-errors.txt
          annotate "Exceptions" causes.txt

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The first admin account, created on startup. Playwright signs in with it.
      ADMIN_EMAIL: e2e-admin@jane-michael.com
      ADMIN_PASSWORD: e2e-admin-password
      ADMIN_NAME: E2E Admin
      # Test-only key. Production keys come from openssl rand -base64 32 and live in the host's settings.
      APP_ENCRYPTION_KEY: ZTJlLW9ubHkta2V5LTAxMjM0NTY3ODlhYmNkZWYwMTI=
      # Put exception messages in error responses so failures are readable in the report.
      SERVER_ERROR_INCLUDE_MESSAGE: always
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jmcrm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -q -DskipTests package

      # Started here (not by Playwright) so its log can be reported if anything fails.
      - name: Start backend
        run: |
          nohup java -jar backend/target/jm-recruiting-crm-*.jar > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "The backend did not start"
          tail -80 backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Playwright reuses the running backend and starts the frontend (see webServer in playwright.config.js).
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Report backend errors
        if: failure()
        run: |
          annotate() {
            local title="$1" file="$2"
            [ -s "$file" ] || return 0
            local message
            message=$(cut -c1-400 "$file" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${title}::${message}"
          }
          grep -E ' ERROR |Exception|Caused by' backend.log | head -40 > causes.txt || true
          tail -40 backend.log > tail.txt || true
          annotate "Backend errors" causes.txt
          annotate "Backend log tail" tail.txt

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  docker:
    name: Docker image builds and serves the app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jmcrm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t jm-recruiting-crm:ci .

      # The same way a host runs it: one DATABASE_URL, then check the app, its routes and the API.
      - name: Smoke test the image
        run: |
          docker run -d --name crm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jmcrm \
            -e ADMIN_EMAIL=smoke@jane-michael.com -e ADMIN_PASSWORD=smoke-test-password \
            -e APP_ENCRYPTION_KEY=c21va2UtdGVzdC1vbmx5LWtleS0wMTIzNDU2Nzg5YWI= \
            jm-recruiting-crm:ci
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/contacts/42 | grep -q '<div id="root">'
          curl -sf -o /dev/null http://localhost:8080/favicon.svg
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/companies)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -qi '^x-frame-options: DENY'
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -qi '^cache-control: no-cache'
          asset=$(curl -s http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -s -D - -o /dev/null "http://localhost:8080$asset" | grep -qi '^cache-control: max-age=31536000'
          curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:8080$asset" | grep -qi '^content-encoding: gzip'
          curl -sf -o /dev/null http://localhost:8080/manifest.webmanifest
          echo "The image serves the app, sends security and caching headers, and protects the API"

      - name: Report the container log
        if: failure()
        run: |
          docker logs crm > container.log 2>&1 || true
          message=$(grep -E ' ERROR |Exception|Caused by' container.log | head -30 | cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Container log::${message:-$(tail -30 container.log | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')}"

  sync:
    name: Desktop copies stay in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the desktop app (Linux database files)
        working-directory: backend
        run: ./mvnw -B -q -DskipTests -Pdesktop-linux package

      # Three copies, each with its own database and ports, set up, joined and synced through a
      # shared folder, including while some are off.
      - name: Sync desktop copies through a shared folder
        working-directory: e2e
        run: |
          jar=$(ls ../backend/target/jm-recruiting-crm-*.jar | grep -v original | head -1)
          node sync/two-computers.mjs "$jar" 2>&1 | tee sync.log
          test "${PIPESTATUS[0]}" = 0

      # Two copies syncing over a direct connection, with the folder slowed right down.
      - name: Sync desktop copies directly
        working-directory: e2e
        run: |
          jar=$(ls ../backend/target/jm-recruiting-crm-*.jar | grep -v original | head -1)
          node sync/direct.mjs "$jar" 2>&1 | tee -a sync.log
          test "${PIPESTATUS[0]}" = 0

      - name: Report sync failures
        if: failure()
        working-directory: e2e
        run: |
          message=$(grep -E 'Failed|Timed out|ERROR|Exception|Caused by' sync.log | head -40 | cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Sync test::${message:-$(tail -40 sync.log | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')}"

  windows:
    name: Windows app builds, starts and sets up
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      JMCRM_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the React app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the desktop jar (Windows database files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/src/main/resources/static | Out-Null
          Copy-Item -Recurse -Force frontend/dist/* backend/src/main/resources/static/
          Push-Location backend
          ./mvnw.cmd -B -q -DskipTests -Pdesktop-windows package
          if ($LASTEXITCODE -ne 0) { throw "Maven build failed" }
          New-Item -ItemType Directory -Force target/desktop | Out-Null
          $jar = Get-ChildItem target/jm-recruiting-crm-*.jar | Where-Object { $_.Name -notlike '*original*' } | Select-Object -First 1
          Copy-Item $jar.FullName target/desktop/app.jar
          Pop-Location
          Copy-Item packaging/windows/splash.png backend/target/desktop/splash.png

      - name: Package JM CRM.exe
        shell: pwsh
        run: |
          jpackage --type app-image --name "JM CRM" --input backend/target/desktop --main-jar app.jar `
            --dest dist --icon packaging/windows/jm-crm.ico --app-version "1.0.${{ github.run_number }}" `
            --vendor "Jane Michael LLC" --description "Jane Michael recruiting CRM" `
            --java-options "-Djmcrm.desktop=true" --java-options "-Xmx768m" `
            --java-options '-splash:$APPDIR/splash.png'
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed" }
          Compress-Archive -Path "dist/JM CRM" -DestinationPath JM-CRM-Windows.zip
          "{0:N0} MB" -f ((Get-Item JM-CRM-Windows.zip).Length / 1MB)

      - name: Start the app and set it up
        shell: pwsh
        env:
          # A folder name with a space, like most Windows user folders.
          JMCRM_HOME: ${{ runner.temp }}\JM CRM test
        run: |
          trap { Write-Output "::error title=Windows smoke test::$($_.Exception.Message)"; break }
          $app = Start-Process -FilePath "dist/JM CRM/JM CRM.exe" -PassThru
          $base = 'http://127.0.0.1:4780'
          $up = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing "$base/api/health").StatusCode -eq 200) { $up = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $up) { throw "The app did not start" }

          $status = Invoke-RestMethod "$base/api/setup/status"
          if (-not ($status.desktop -and $status.needsSetup)) { throw "Expected the setup screen, got $($status | ConvertTo-Json)" }

          # Google Drive's folder on Windows, with spaces in the path. The CRM creates "JM CRM Sync" in it.
          $drive = Join-Path $env:RUNNER_TEMP 'Google Drive\My Drive'
          New-Item -ItemType Directory -Force $drive | Out-Null
          $folder = Join-Path $drive 'JM CRM Sync'

          Invoke-WebRequest -UseBasicParsing "$base/api/auth/csrf" -SessionVariable session | Out-Null
          $token = ($session.Cookies.GetCookies($base) | Where-Object Name -eq 'XSRF-TOKEN').Value
          $body = @{ computerName = 'CI'; name = 'CI Admin'; email = 'ci@jane-michael.test'; password = 'ci-password-123'; syncFolder = $folder } | ConvertTo-Json
          $result = Invoke-RestMethod -Method Post -Uri "$base/api/setup/start" -WebSession $session `
            -ContentType 'application/json' -Headers @{ 'X-XSRF-TOKEN' = $token } -Body $body
          if ($result.key.Length -ne 44) { throw "Setup did not return a key" }

          $page = Invoke-WebRequest -UseBasicParsing "$base/"
          if ($page.Content -notmatch 'id="root"') { throw "The app page did not load" }
          $settings = Get-Content -Raw "$env:JMCRM_HOME\settings.properties"
          if ($settings -notmatch 'sync\.token') { throw "The sync token was not saved" }
          if ($settings.Contains($result.key.Substring(0, 40))) { throw "The CRM key was saved on disk" }

          # The CRM writes its encrypted sync files into the shared folder.
          if (-not (Test-Path (Join-Path $folder 'crm.check'))) { throw "The sync folder was not set up" }
          if (-not (Test-Path (Join-Path $folder 'computer-1\about.jmcrm'))) { throw "No sync files were written" }
          if (-not (Get-ChildItem (Join-Path $folder 'computer-1') -Filter '0*.jmcrm')) { throw "No changes were written" }

          # Locked until someone signs in.
          $status = Invoke-RestMethod "$base/api/setup/status"
          if (-not $status.locked) { throw "Expected the CRM to be locked after setup" }

          # Opening it again while it runs just opens the browser.
          $second = Start-Process -FilePath "dist/JM CRM/JM CRM.exe" -PassThru
          if (-not $second.WaitForExit(60000)) { throw "A second copy kept running" }

          Stop-Process -Id $app.Id -Force
          Write-Output "The Windows app starts its database, serves the CRM, completes setup and writes to the sync folder"

      - name: Show the app log
        if: failure()
        shell: pwsh
        env:
          JMCRM_HOME: ${{ runner.temp }}\JM CRM test
        run: |
          $lines = @()
          Get-ChildItem -Recurse "$env:JMCRM_HOME\logs" -File -ErrorAction SilentlyContinue | ForEach-Object {
            $lines += "--- $($_.Name)"
            $lines += Get-Content $_.FullName | Select-String -Pattern 'ERROR|Exception|Caused by|WARN' | Select-Object -First 30 | ForEach-Object { $_.Line }
            $lines += Get-Content $_.FullName -Tail 25
          }
          if ($lines.Count -eq 0) { $lines = @('No log files were written.') }
          $message = ($lines | ForEach-Object { $_.Substring(0, [Math]::Min(300, $_.Length)) }) -join '%0A'
          Write-Output "::error title=Windows app log::$message"

      - uses: actions/upload-artifact@v7
        with:
          name: JM-CRM-Windows
          path: JM-CRM-Windows.zip

      # A stable download link for the newest build of main.
      - name: Publish the download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag 2>$null
          gh release create windows-latest JM-CRM-Windows.zip --target "${{ github.sha }}" `
            --title "JM CRM for Windows" `
            --notes "Download JM-CRM-Windows.zip, unzip it, and open JM CRM.exe. Setup steps: docs/WINDOWS.md."
